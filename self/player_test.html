<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試音樂播放器 - 生成測試音頻版本</title>
    <link rel="stylesheet" href="player.css">
</head>
<body>
    <div class="player-container">
        <!-- Logo 區域 -->
        <div class="logo-section">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 80'%3E%3Crect fill='%23667eea' width='200' height='80' rx='8'/%3E%3Ctext x='50%' y='50%' font-size='24' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'%3E分署LOGO%3C/text%3E%3C/svg%3E" alt="分署Logo">
            <div class="logo-text">行政院勞動部勞動力發展署</div>
        </div>

        <!-- 標題 -->
        <h1 class="player-title">🎵 測試音樂播放器</h1>

        <!-- 資訊看版 -->
        <div class="info-display">
            <div class="info-row">
                <span class="info-label">目前曲目：</span>
                <span class="song-title" id="songTitle">Happy Day</span>
            </div>
            <div class="info-row">
                <span class="info-label">播放狀態：</span>
                <span class="info-value" id="status">已停止</span>
            </div>
            <div class="info-row">
                <span class="info-label">時間進度：</span>
                <span class="time-info">
                    <span id="currentTime">0:00</span>
                    <span>/</span>
                    <span id="duration">0:00</span>
                </span>
            </div>
        </div>

        <!-- 進度條 -->
        <div class="progress-section">
            <div class="progress-bar-container" id="progressBarContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">3:00</span>
            </div>
        </div>

        <!-- 曲目選擇 -->
        <div class="playlist-section">
            <label class="playlist-label" for="playlistSelect">選擇曲目：</label>
            <select id="playlistSelect" class="playlist-select"></select>
        </div>

        <!-- 控制按鈕 -->
        <div class="control-buttons">
            <button class="btn btn-secondary tooltip" id="prevBtn" data-tooltip="上一首">
                ⏮️ 上一首
            </button>
            <button class="btn btn-secondary tooltip" id="rewindBtn" data-tooltip="倒轉10秒">
                ⏪ 倒轉
            </button>
            <button class="btn btn-primary tooltip" id="playBtn" data-tooltip="播放 (Space)">
                ▶️ 播放
            </button>
            <button class="btn btn-secondary tooltip" id="pauseBtn" data-tooltip="暫停">
                ⏸️ 暫停
            </button>
            <button class="btn btn-secondary tooltip" id="stopBtn" data-tooltip="停止">
                ⏹️ 停止
            </button>
        </div>

        <div class="control-buttons">
            <button class="btn btn-secondary tooltip" id="fastForwardBtn" data-tooltip="快轉10秒" style="grid-column: span 2;">
                ⏩ 快轉
            </button>
            <button class="btn btn-secondary tooltip" id="nextBtn" data-tooltip="下一首">
                ⏭️ 下一首
            </button>
            <div style="grid-column: span 2;"></div>
        </div>

        <!-- 音量控制 -->
        <div class="volume-section">
            <span class="volume-icon">🔊</span>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70">
            <span class="volume-value" id="volumeValue">70%</span>
        </div>

        <!-- 隱藏的音頻元素 -->
        <audio id="audioPlayer" class="audio-element"></audio>
    </div>

    <!-- 引入修改的 JavaScript 文件（測試版本） -->
    <script>
        /**
         * 音樂播放器類別 - 測試版本
         * 使用 Web Audio API 生成測試音頻
         */
        class MusicPlayer {
            /**
             * 構造函數 - 初始化播放器
             */
            constructor() {
                // DOM元素
                this.audio = document.getElementById('audioPlayer');
                this.playBtn = document.getElementById('playBtn');
                this.pauseBtn = document.getElementById('pauseBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.prevBtn = document.getElementById('prevBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.fastForwardBtn = document.getElementById('fastForwardBtn');
                this.rewindBtn = document.getElementById('rewindBtn');
                this.playlistSelect = document.getElementById('playlistSelect');
                this.volumeSlider = document.getElementById('volumeSlider');
                this.volumeValue = document.getElementById('volumeValue');
                this.progressBar = document.getElementById('progressBar');
                this.progressBarContainer = document.getElementById('progressBarContainer');
                this.currentTimeDisplay = document.getElementById('currentTime');
                this.durationDisplay = document.getElementById('duration');
                this.songTitleDisplay = document.getElementById('songTitle');
                this.statusDisplay = document.getElementById('status');
                this.playerContainer = document.querySelector('.player-container');

                // 播放列表數據 - 使用 Blob URLs 作為測試源
                this.playlist = [
                    {
                        id: 1,
                        title: '高音測試 (C5)',
                        duration: '3:00',
                        frequency: 523.25,  // C5
                        duration_seconds: 180
                    },
                    {
                        id: 2,
                        title: '中音測試 (A4)',
                        duration: '3:00',
                        frequency: 440,    // A4
                        duration_seconds: 180
                    },
                    {
                        id: 3,
                        title: '低音測試 (C4)',
                        duration: '3:00',
                        frequency: 261.63, // C4
                        duration_seconds: 180
                    },
                    {
                        id: 4,
                        title: '多音組合',
                        duration: '2:00',
                        frequency: 'multi',  // 多個頻率
                        duration_seconds: 120
                    },
                    {
                        id: 5,
                        title: '白噪聲測試',
                        duration: '2:00',
                        frequency: 'noise',  // 白噪聲
                        duration_seconds: 120
                    }
                ];

                // 播放器狀態
                this.currentTrackIndex = 0;
                this.isPlaying = false;
                this.skipAmount = 10;
                this.defaultVolume = 70;
                this.audioContext = null;
                this.oscillators = [];
                this.gainNode = null;

                // 初始化播放器
                this.initializePlayer();
            }

            /**
             * 初始化播放器
             */
            initializePlayer() {
                this.setupPlaylist();
                this.attachEventListeners();
                this.setupAudioContext();
                this.updateDisplay();
            }

            /**
             * 設置 Audio Context
             */
            setupAudioContext() {
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.gainNode = this.audioContext.createGain();
                    this.gainNode.connect(this.audioContext.destination);
                    this.setVolume(this.defaultVolume);
                }
            }

            /**
             * 設置播放列表下拉選單
             */
            setupPlaylist() {
                this.playlistSelect.innerHTML = '';
                this.playlist.forEach((track, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${index + 1}. ${track.title}`;
                    this.playlistSelect.appendChild(option);
                });
            }

            /**
             * 綁定事件監聽器
             */
            attachEventListeners() {
                // 按鈕事件
                this.playBtn.addEventListener('click', () => this.play());
                this.pauseBtn.addEventListener('click', () => this.pause());
                this.stopBtn.addEventListener('click', () => this.stop());
                this.prevBtn.addEventListener('click', () => this.previousTrack());
                this.nextBtn.addEventListener('click', () => this.nextTrack());
                this.fastForwardBtn.addEventListener('click', () => this.fastForward());
                this.rewindBtn.addEventListener('click', () => this.rewind());

                // 選擇曲目事件
                this.playlistSelect.addEventListener('change', (e) => {
                    this.loadTrack(parseInt(e.target.value));
                });

                // 音量滑桿事件
                this.volumeSlider.addEventListener('input', (e) => {
                    this.setVolume(e.target.value);
                });

                // 進度條事件
                this.progressBarContainer.addEventListener('click', (e) => {
                    this.seekTo(e);
                });

                // 模擬時間更新
                this.simulateTimeUpdate();

                // 鍵盤快捷鍵
                document.addEventListener('keydown', (e) => this.handleKeyboard(e));
            }

            /**
             * 模擬時間更新
             */
            simulateTimeUpdate() {
                setInterval(() => {
                    if (this.isPlaying) {
                        this.audio.currentTime += 1;
                        this.updateProgress();

                        // 檢查是否到達結束
                        const track = this.playlist[this.currentTrackIndex];
                        if (this.audio.currentTime >= track.duration_seconds) {
                            this.nextTrack();
                        }
                    }
                }, 1000);
            }

            /**
             * 載入指定軌道
             */
            loadTrack(index) {
                if (index < 0) {
                    this.currentTrackIndex = this.playlist.length - 1;
                } else if (index >= this.playlist.length) {
                    this.currentTrackIndex = 0;
                } else {
                    this.currentTrackIndex = index;
                }

                const track = this.playlist[this.currentTrackIndex];
                this.audio.src = '';  // 清空音頻源
                this.audio.currentTime = 0;
                this.playlistSelect.value = this.currentTrackIndex;
                this.updateDisplay();
                this.updateStatus('已載入');
            }

            /**
             * 播放
             */
            play() {
                this.setupAudioContext();
                
                if (!this.isPlaying) {
                    this.stopAllOscillators();
                    
                    const track = this.playlist[this.currentTrackIndex];
                    
                    if (this.audio.currentTime === 0) {
                        this.generateTestAudio(track);
                    }
                    
                    this.isPlaying = true;
                    this.playerContainer.classList.add('playing');
                    this.updateStatus('正在播放');
                }
            }

            /**
             * 生成測試音頻
             */
            generateTestAudio(track) {
                const now = this.audioContext.currentTime;

                if (track.frequency === 'multi') {
                    // 多音組合
                    const frequencies = [440, 554.37, 659.25];  // A4, C#5, E5
                    frequencies.forEach(freq => {
                        this.createOscillator(freq, now);
                    });
                } else if (track.frequency === 'noise') {
                    // 白噪聲
                    const bufferSize = this.audioContext.sampleRate * 2;
                    const noiseBuffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    const noiseSource = this.audioContext.createBufferSource();
                    noiseSource.buffer = noiseBuffer;
                    noiseSource.loop = true;
                    noiseSource.connect(this.gainNode);
                    noiseSource.start(now);
                    this.oscillators.push(noiseSource);
                } else {
                    // 單頻音
                    this.createOscillator(track.frequency, now);
                }
            }

            /**
             * 創建震蕩器
             */
            createOscillator(frequency, startTime) {
                const osc = this.audioContext.createOscillator();
                osc.frequency.value = frequency;
                osc.type = 'sine';
                osc.connect(this.gainNode);
                osc.start(startTime);
                this.oscillators.push(osc);
            }

            /**
             * 停止所有震蕩器
             */
            stopAllOscillators() {
                this.oscillators.forEach(osc => {
                    try {
                        osc.stop();
                    } catch (e) {
                        // 已停止或已完成
                    }
                });
                this.oscillators = [];
            }

            /**
             * 暫停
             */
            pause() {
                this.stopAllOscillators();
                this.isPlaying = false;
                this.playerContainer.classList.remove('playing');
                this.updateStatus('已暫停');
            }

            /**
             * 停止
             */
            stop() {
                this.stopAllOscillators();
                this.isPlaying = false;
                this.audio.currentTime = 0;
                this.playerContainer.classList.remove('playing');
                this.updateProgress();
                this.updateStatus('已停止');
            }

            /**
             * 上一首
             */
            previousTrack() {
                this.loadTrack(this.currentTrackIndex - 1);
                if (this.isPlaying) {
                    this.play();
                }
            }

            /**
             * 下一首
             */
            nextTrack() {
                this.pause();
                this.loadTrack(this.currentTrackIndex + 1);
                if (this.isPlaying) {
                    this.play();
                }
            }

            /**
             * 快轉
             */
            fastForward() {
                const track = this.playlist[this.currentTrackIndex];
                const newTime = Math.min(
                    this.audio.currentTime + this.skipAmount,
                    track.duration_seconds
                );
                this.audio.currentTime = newTime;
                this.updateStatus(`快轉 +${this.skipAmount}秒`);
            }

            /**
             * 倒轉
             */
            rewind() {
                const newTime = Math.max(
                    this.audio.currentTime - this.skipAmount,
                    0
                );
                this.audio.currentTime = newTime;
                this.updateStatus(`倒轉 -${this.skipAmount}秒`);
            }

            /**
             * 設置音量
             */
            setVolume(value) {
                const volumePercent = Math.max(0, Math.min(100, value));
                this.volumeSlider.value = volumePercent;
                this.volumeValue.textContent = volumePercent + '%';
                
                if (this.gainNode) {
                    this.gainNode.gain.value = volumePercent / 100;
                }
            }

            /**
             * 搜尋指定時間
             */
            seekTo(e) {
                const track = this.playlist[this.currentTrackIndex];
                if (!track) return;

                const rect = this.progressBarContainer.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                this.audio.currentTime = Math.max(0, Math.min(percent * track.duration_seconds, track.duration_seconds));
                this.updateProgress();
            }

            /**
             * 更新進度條
             */
            updateProgress() {
                const track = this.playlist[this.currentTrackIndex];
                if (track) {
                    const percent = (this.audio.currentTime / track.duration_seconds) * 100;
                    this.progressBar.style.width = Math.min(percent, 100) + '%';
                }
                this.currentTimeDisplay.textContent = this.formatTime(this.audio.currentTime);
            }

            /**
             * 更新顯示信息
             */
            updateDisplay() {
                const track = this.playlist[this.currentTrackIndex];
                this.songTitleDisplay.textContent = track.title;
                this.durationDisplay.textContent = track.duration;
                this.updateProgress();
            }

            /**
             * 更新狀態文本
             */
            updateStatus(status) {
                this.statusDisplay.textContent = status;
            }

            /**
             * 格式化時間
             */
            formatTime(seconds) {
                if (!seconds || isNaN(seconds)) {
                    return '0:00';
                }

                const minutes = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
            }

            /**
             * 處理鍵盤快捷鍵
             */
            handleKeyboard(e) {
                if (e.target === document.body) {
                    switch (e.code) {
                        case 'Space':
                            e.preventDefault();
                            this.isPlaying ? this.pause() : this.play();
                            break;
                        case 'ArrowRight':
                            this.fastForward();
                            break;
                        case 'ArrowLeft':
                            this.rewind();
                            break;
                        case 'ArrowUp':
                            e.preventDefault();
                            this.setVolume(parseInt(this.volumeSlider.value) + 5);
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            this.setVolume(parseInt(this.volumeSlider.value) - 5);
                            break;
                    }
                }
            }
        }

        /**
         * 初始化播放器 - 頁面加載完成後
         */
        document.addEventListener('DOMContentLoaded', () => {
            const player = new MusicPlayer();
            window.musicPlayer = player;
            console.log('🎵 測試音樂播放器已初始化');
            console.log('快捷鍵: Space(播放/暫停), ←(倒轉), →(快轉), ↑↓(音量)');
        });
    </script>
</body>
</html>
