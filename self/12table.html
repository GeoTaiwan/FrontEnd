<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
    <style>
        table {

            /* border-collapse: collapse; */

<body>
    <!-- 表格預設不顯示框線 
     html的屬性預設值就是px

    <!-- 學習表格

    2.各表格在哪裡

    <!-- 避免用html設定外觀，應使用CSS設定 -->

    <!-- <table style="border: 1px solid black;border-collapse: collapse"> -->
    <!--table會自動產生tbody標籤，thead、tfoot須自行寫入(不在thead或tfoot中的，統統會被列入tbody中)。顯示時，thead固定在最上一列，tfoot在最下一列。-->
    <table>
        <tbody>
            <tr>
                <td></td>
                <td rowspan="3"></td>
