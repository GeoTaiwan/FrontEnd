<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function test() {
            console.log("test function")
        }
        let test2 = function () {

        }

        console.log(typeof test);
        console.log(typeof test2);


        let test3 = () => { }
        console.log(typeof test3);



        /* setInterval(() => {
            console.log("setInterval function");
        }, 500);
        setInterval(test, 500); */

        // ()=>{} 箭頭函數 效果等同 function(){} ，皆為未命名函數
        ////////////////////////////////////
        let aa = function (a, b) {

        }
        aa(1, 2);

        let aa2 = (a, b) => {

        }
        aa2(1, 2);

        let bb = (a) => {

        }
        bb(1);
        // 函數參數只有一個時，可以省略小括號
        let bb2 = a => {

        }
        bb2(1);

        //////////////////////////
        let bb3 = a => {
            console.log(a);
        }
        bb3(5);
        // 若要執行的程式碼只有一行，大括號也可省略
        let bb4 = a => console.log(a);
        bb4(5);


        ///////////////////////

        let f = [2, 1, 3];
        let f2 = [];

        for (let item of f) {
            f2.push(item * item);
            console.log(item * item);
        }

        //////////////////////
        let g = f.map(i => i * i);
        console.log(f);
        console.log(f2);
        console.log(g);

    </script>
</body>

</html>
