<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /*   table,
        th,
        td {
            border: 1px solid black;
            background-color: pink;
        } */


        #tb1 {
            border: 5px double black;
            width: 400px;
            height: 300px;
        }

        #tb1 th,
        td {
            border: 1px solid black;
        }


        #tb1>thead>tr>th:first-child~th {
            background-color: brown;

        }

        #tb1 thead {
            background-color: darkslateblue;
            color: white;
        }

        #tb1 tbody tr:nth-child(3) {
            color: blue;

        }

        #tb1>tbody>tr:hover {
            background-color: yellow;
            font-size: 1.3rem;
            color: red;
            font-weight: 900;
        }


        a:link {
            color: green;
            text-decoration: none;
            
        }

        a:active {
            color: rgb(36, 87, 145);
            text-decoration: underline;
            background-color: yellow;
        }

        a:visited {
            color: rgb(248, 186, 52);

        }
    </style>

</head>

<body>

    <a href="#">我的超鏈結</a>
    <hr>


    <table id="tb1">
