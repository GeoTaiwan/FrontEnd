<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .col1 {
            background-color: aqua;
        }

        .col2 {
            background-color: blueviolet;
        }

        .col3 {
            background-color: cadetblue;
        }
    </style>
</head>

<body>


    <div class="container">

        <div class="row">
            <div class="col1 col-md-2">Col 1</div>
            <div class="col2 col-md-5">Col 2</div>
            <div class="col3 col-md-5">Col 3</div>
        </div>
        <div class="row row-cols-4 justify-content-end">
            <div class="col2">Col 4</div>
            <div class="col3">Col 5</div>
            <div class="col1">Col 6</div>
        </div>
           <hr>
        <!-- 一個列上的格子不滿12 -->
        <div class="row  justify-content-center">
            <div class="col1 col-3">Col 7</div>
            <div class="col2 col-3">Col 8</div>
            <div class="col3 col-4">Col 9</div>
        </div>
        <div class="row">
            <div class="col2 col-2 offset-1">Col 10</div>
            <div class="col3 col-4 offset-2">Col 11</div>
            <div class="col1 col-1">Col 12</div>
        </div>
        <hr>
        <!-- 一個列上的格子超過12 -->
        <div class="row">
            <div class="col1 col-3">Col 7</div>
            <div class="col2 col-7">Col 8</div>
            <div class="col3 col-8">Col 9</div>
        </div>
        <div class="row">
            <div class="col2 col-2 offset-5">Col 10</div>
            <div class="col3 col-4 offset-2">Col 11</div>
            <div class="col1 col-1">Col 12</div>
        </div>
         <div class="row  justify-content-center">
            <div class="col1 col-3">Col 7</div>
            <div class="col2 col-7">Col 8</div>
            <div class="col3 col-8">Col 9</div>
        </div>
    </div>
</body>

</html>
